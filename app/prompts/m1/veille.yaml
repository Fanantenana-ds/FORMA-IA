  (DATE_DU_JOUR = 2026-08-13)
  Output:
  {
    "opportunities": [
      {
        "title": "Stage Data Science à Antananarivo",
        "source": "Société Antananarivo (non précisée)",
        "source_site": "Asako.mg",
        "source_priority": "niveau_1",
        "url": null,
        "budget": "Non précisé",
        "deadline": null,
        "organizer": "Société Antananarivo",
        "domain": "data",
        "summary": "Stage en Data Science à Antananarivo. Informations partielles.",
        "score": 40,
        "confidence": 0.55,
        "reason": "Domaine Data (+20), poste spécifique (+10), source Niveau 1 (+10) = 40. Manque budget, deadline, organisation précise.",
        "flags": ["low_confidence", "budget_unknown", "partial_info"]
      }
    ],
    "total": 1,
    "notes": ""
  }

security: |
  RÈGLES DE SÉCURITÉ ABSOLUES :
  1. ✅ Ne JAMAIS inventer d'informations (budget, date, URL, organisation)
  2. ✅ Si information manquante → "Non précisé" ou null
  3. ✅ Ne JAMAIS citer des tarifs non publiés
  4. ✅ Le nombre d'opportunités doit refléter la réalité (0 à 20 max)
  5. ✅ Score et confiance doivent refléter la réalité — pas de gonflement artificiel
  6. ✅ Niveau 1 (Madagascar) en PRIORITÉ absolue
  7. ✅ Les flags DOIVENT être utilisés pour signaler toute faiblesse
  8. ✅ Tous les champs texte en français (sauf noms propres)
  9. ✅ Le calcul affiché dans "score" doit correspondre EXACTEMENT à l'addition dans "reason"
  10. ✅ Si données vides → opportunities vide avec notes explicatives