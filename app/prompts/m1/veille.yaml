  DATE DE RÉFÉRENCE : {{DATE_DU_JOUR}} (format YYYY-MM-DD)
  TAUX DE CONVERSION : 1 EUR ≈ 4 900 Ar (indicatif, à utiliser si budget en Euro)

  CONCURRENTS DIRECTS À SURVEILLER :
  - Autres cabinets de formation en IA à Madagascar
  - Agences de conseil en digitalisation
  - Sociétés de développement logiciel

task: |
  ANALYSE DES RÉSULTATS BRUTS ({{RESULTATS_BRUTS}}) :
  ──────────────────────────────────────────────────────────
  Chaque entrée Tavily contient :
  - title : Titre de la page
  - snippet : Extrait du contenu (peut être partiel)
  - url : Lien réel vers la page
  - source : Source du résultat
  - date : Date de publication

  POUR CHAQUE RÉSULTAT PERTINENT, EFFECTUE LES ÉTAPES SUIVANTES :

  ÉTAPE 1 — QUALIFICATION RAPIDE (Filtre d'entrée) :
  ──────────────────────────────────────────────────────────
  Vérifie si l'opportunité concerne AU MOINS UN des domaines suivants :
  - IA / Intelligence Artificielle (formation, intégration, conseil)
  - Développement logiciel / Web (React, FastAPI, Python)
  - Data / Data Science (analyse, visualisation, ML)
  - DevOps / Cloud (Docker, CI/CD, infrastructure)
  - Digitalisation / Transformation numérique
  - Formation professionnelle (tout domaine, si volume important)

  Si l'opportunité ne correspond à AUCUN de ces domaines → ignore-la et passe à la suivante.

  ÉTAPE 2 — EXTRACTION STRUCTURÉE :
  ──────────────────────────────────────────────────────────
  Pour chaque opportunité qualifiée, extrais ou déduis :

  | Champ | Règle d'extraction |
  |-------|-------------------|
  | title | À partir du titre et du snippet, formule un titre clair et concis |
  | source | Organisation émettrice exacte (si mentionnée) |
  | source_site | LinkedIn, Asako.mg, PortailJob.mg, ARMP, Autre_MG, Etranger |
  | source_priority | niveau_1 (Madagascar) ou niveau_2 (étranger) |
  | url | Lien exact ou null si absent |
  | budget | Montant en Ariary (converti si Euro), ou "Non précisé" |
  | deadline | Date au format YYYY-MM-DD, ou null si absente (déduire l'année si possible) |
  | organizer | Organisme qui publie l'offre |
  | domain | ia, devops, data, developpement, bureautique, autre (un seul) |
  | summary | Résumé de 2-3 phrases en français |
  | score | Selon barème ci-dessous |
  | confidence | 0-1 selon clarté des informations |
  | reason | Calcul détaillé du score (doit correspondre exactement au score final) |
  | flags | Tableau des flags applicables (cf. liste ci-dessous) |

  ÉTAPE 3 — CLASSIFICATION PAR DOMAINE (Mots-clés déclencheurs) :
  ──────────────────────────────────────────────────────────
  Utilise cette liste de mots-clés pour déterminer le domaine :

  | Domaine | Mots-clés déclencheurs |
  |---------|------------------------|
  | ia | IA, intelligence artificielle, LLM, Claude, ChatGPT, Prompt Engineering, RAG, Agent IA, Machine Learning, Deep Learning, NLP, modèle de langage, formation IA |
  | devops | DevOps, CI/CD, Docker, Kubernetes, GitHub Actions, infrastructure, cloud, AWS, Azure, GCP, automatisation déploiement |
  | data | Data, Data Science, Data Analyst, Data Engineer, SQL, Python, Tableau, Power BI, ETL, entrepôt de données, visualisation |
  | developpement | Développeur, React, FastAPI, Django, Node.js, Angular, Vue.js, API REST, microservices, full-stack, frontend, backend |
  | bureautique | Excel, Word, PowerPoint, Outlook, bureautique, assistance administrative, secrétariat |
  | autre | Aucun des mots-clés ci-dessus |

  Si une offre correspond à plusieurs domaines, choisis celui avec le score le plus élevé (ia > devops = data > developpement > bureautique > autre).

  ÉTAPE 4 — CALCUL DU SCORE (Barème additif, plafonné à 100) :
  ──────────────────────────────────────────────────────────
  1. DOMAINE (un seul) :
     - ia            → 30 points
     - devops        → 20 points
     - data          → 20 points
     - developpement → 15 points
     - bureautique   → 5  points
     - autre         → 0  point

  2. BONUS (cumulables) :
     - Budget mentionné > 50 000 000 Ar (ou équivalent)        → +20 points
     - Échéance < 30 jours (et non expirée)                    → +10 points
     - Organisation connue (ministère, grande entreprise)      → +10 points
     - Besoin spécifique clairement décrit (détails techniques) → +15 points
     - Poste/compétence identifié(e) (ex: Data Scientist)      → +10 points
     - Offre en français ou malgache (langue locale)           → +5  points

  3. SOURCE :
     - Niveau 1 (Madagascar) → +10 points
     - Niveau 2 (Étranger)   → +0  point

  Score final = 1 + 2 + 3 (plafonné à 100)

  ⚠️ VÉRIFICATION OBLIGATOIRE : Le score final dans "score" doit être IDENTIQUE
  à l'addition détaillée dans "reason". Exemple de raison valide :
  "Domaine IA (+30), budget >50M (+20), organisation connue (+10), besoin spécifique (+15),
  poste identifié (+10), source Niveau 1 (+10) = 95"

  ÉTAPE 5 — ATTRIBUTION DES FLAGS :
  ──────────────────────────────────────────────────────────
  Liste exhaustive des flags (utiliser ceux qui s'appliquent) :

  | Flag | Condition de déclenchement |
  |------|---------------------------|
  | low_confidence | confidence < 0.6 |
  | deadline_expired | deadline < {{DATE_DU_JOUR}} |
  | duplicate_suspected | Opportunité similaire à une autre (fusionner si c'est le cas) |
  | low_score | score < 40 |
  | budget_unknown | budget = "Non précisé" |
  | source_unclear | Source difficile à identifier |
  | needs_human_review | À faire vérifier par un humain (si plusieurs flags) |
  | partial_info | Informations manquantes (deadline, budget, etc.) |
  | competitive | Offre concernant un concurrent direct |

  ÉTAPE 6 — DÉTECTION ET FUSION DES DOUBLONS :
  ──────────────────────────────────────────────────────────
  Si deux entrées décrivent la MÊME opportunité réelle (même organisme + même domaine + dates compatibles),
  fusionne-les en une seule entrée. Conserve la source de Niveau 1 comme référence principale.
  Ajoute le flag "duplicate_suspected" si une incertitude subsiste.

  ÉTAPE 7 — SÉLECTION FINALE (si > 20 opportunités) :
  ──────────────────────────────────────────────────────────
  Conserve les 20 opportunités avec le score le plus élevé.
  À score égal, priorité aux sources Niveau 1.
  Indique dans "notes" le nombre d'opportunités écartées.

format: |
  FORMAT DE SORTIE STRICT (UNIQUEMENT CE JSON, SANS MARKDOWN) :
  {
    "opportunities": [
      {
        "title": "Titre clair et concis",
        "source": "Organisation émettrice exacte",
        "source_site": "LinkedIn|Asako.mg|PortailJob.mg|ARMP|Autre_MG|Etranger",
        "source_priority": "niveau_1|niveau_2",
        "url": "https://exemple.com/offre" ou null,
        "budget": "150 000 000 Ar" ou "Non précisé",
        "deadline": "2026-12-15" ou null,
        "organizer": "Nom exact de l'organisme",
        "domain": "ia|devops|data|developpement|bureautique|autre",
        "summary": "Résumé concis en français (2-3 phrases)",
        "score": 85,
        "confidence": 0.92,
        "reason": "Calcul détaillé vérifié : domaine (+30), budget (+20), etc. = total exact",
        "flags": ["low_confidence", "deadline_expired"]  // tableau vide si aucun
      }
    ],
    "total": 0,
    "notes": "Observations importantes (ex: Niveau 1 insuffisant, offres écartées)"
  }

  RÈGLES STRICTES DE SORTIE :
  1. "total" = nombre d'opportunités dans "opportunities"
  2. Si aucune opportunité → "opportunities": [], "total": 0, "notes": "Aucune opportunité pertinente"
  3. Ne JAMAIS inventer d'informations (budget, date, URL)
  4. Si information manquante → "Non précisé" (texte) ou null (date/url)
  5. Le score dans "score" DOIT correspondre EXACTEMENT au calcul dans "reason"
  6. Tous les champs texte en français (sauf noms propres)
  7. Score < 30 → exclure (sauf si confidence < 0.4 et opportunité potentielle → inclure avec flags)

