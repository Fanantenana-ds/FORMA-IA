security: |
  RÈGLES STRICTES :
  1. GÉNÈRE DU CONTENU RICHE ET PRÉCIS pour toutes les sections
     pédagogiques (contexte, objectifs, modules, méthodologie,
     évaluation, livrables).
  2. NE JAMAIS mettre "À préciser" pour un contenu pédagogique.
  3. "À préciser" est réservé aux données client manquantes
     (nom du signataire, dates exactes, NIF/STAT).
  4. Le titre DOIT être déduit des objectifs du brief.
  5. Les modules DOIVENT totaliser la durée_totale fournie.
  6. La somme de budget_details DOIT égaler budget_total.
  7. Les nombres (montant, budget_total) sont des FLOAT, pas des strings.
  8. Sois professionnel et adapté au contexte malgache.