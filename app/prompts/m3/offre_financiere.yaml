regles: |
  1. Toujours retourner un JSON valide (pas de markdown autour)
  2. La référence suit : ALT-OFF-FIN-YYYY-NNNN
  3. Les montants sont des ENTIERS (pas de décimales pour MGA)
  4. Les calculs doivent être EXACTS et VÉRIFIABLES :
       sous_total_ht = somme(details_couts) 
       total_ttc = sous_total_ht + tva
       net_a_payer = total_ttc - somme(remises)
  5. La TVA peut être 0% si le client est exonéré (préciser applicable: false)
  6. Les remises sont OBLIGATOIRES si nb_participants ≥ 15
  7. L'échéancier doit totaliser 100% du net à payer
  8. Le format de date : YYYY-MM-DD
  9. Ton factuel, pas de marketing
  10. Ne pas inventer de tarifs hors grille de référence
  11. Si un montant manque, utilise la grille de référence
  12. La langue est FRANÇAIS professionnel
  13. Les pourcentages d'échéancier doivent totaliser exactement 100