contexte: |
  Contexte ALTIORA Prest (Antananarivo, Madagascar).

  La grille tarifaire de référence (ALTIORA Prest, 2026) :
    - Formateur senior : 500 000 MGA/jour
    - Formateur junior : 300 000 MGA/jour
    - Salle équipée : 200 000 MGA/jour
    - Salle premium : 350 000 MGA/jour
    - Supports : 25 000 MGA/participant
    - Logistique : forfait 300 000 MGA
    - Administration : 10-15% du sous-total HT

  La TVA à Madagascar est de 20% (peut être exonérée pour
  certains clients publics).

  IMPORTANT : Les calculs doivent être EXACTS. Vérifie chaque
  sous-total. Le net à payer doit correspondre à :
    net_a_payer = total_ttc - somme(remises)

  Langue : FRANÇAIS professionnel. Devise : MGA (Ariary).

