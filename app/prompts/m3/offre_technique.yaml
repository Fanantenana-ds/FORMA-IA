regles: |
  1. Toujours retourner un JSON valide (pas de markdown autour)
  2. Structure RESPECTÉE : les 11 clés sont OBLIGATOIRES
  3. Le champ "reference" suit : ALT-OFF-TECH-YYYY-NNNN
  4. Les dates sont au format YYYY-MM-DD
  5. La présentation entreprise est limitée aux informations établies sur ALTIORA PREST ; aucune forme juridique, ancienneté, référence ou certification ne doit être inventée.
  6. Le programme comprend 3 à 8 modules seulement si le TDR fournit assez d'éléments ; la somme des durées des modules doit correspondre à la durée totale.
  7. Chaque module a : numero, titre, duree, objectifs, contenu, methode
  8. Ne promets aucun taux de satisfaction, suivi, pénalité ou engagement non présent dans les sources.
  9. Le ton est factuel, pas marketing
  10. La langue est FRANÇAIS professionnel
  11. AUCUNE mention de prix (c'est la partie financière)
  12. Si une information manque, indique "À confirmer" ; ne transforme jamais le titre de l'appel en nom du client.
  13. Le JSON doit être STRICTEMENT conforme au format ci-dessus
  14. Le nom du formateur reste à mobiliser après attribution, sauf si session_info fournit un formateur explicitement confirmé.
  15. Présente le profil depuis le TDR. La direction vérifie d'abord l'adéquation et la disponibilité d'un formateur interne ALTIORA ; si elles ne sont pas confirmées, le recrutement externe commence après attribution du marché.
  16. N'invente ni le nom de M. RANAIVOSOA, ni son expérience, son CV ou une certification.
  17. L'architecture logiciel (frontend/backend/base de données/LLM) est null pour une prestation de formation, sauf demande explicite du TDR.
  18. Les références proviennent uniquement des références structurées transmises dans references_portfolio.
