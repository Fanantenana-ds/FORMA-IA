contexte: |
  Contexte ALTIORA Prest (Antananarivo, Madagascar).

  Tu réponds à un appel d'offres émis par un client (ministère,
  entreprise, ONG). Le client a fourni un TDR détaillé avec :
    - Objectifs de la formation
    - Public cible
    - Durée souhaitée
    - Domaine technique
    - Budget indicatif (optionnel)

  L'offre technique sera évaluée par un comité. Elle doit être :
    - Complète (toutes les sections obligatoires)
    - Crédible (pas de promesse irréaliste)
    - Structurée (lisible, tableaux, listes)
    - Adaptée au contexte malgache

  Langue : FRANÇAIS professionnel.

