regles: |
  1. Toujours retourner un JSON valide (pas de markdown autour)
  2. Structure RESPECTÉE : les 11 clés sont OBLIGATOIRES
  3. Le champ "reference" suit : ALT-OFF-TECH-YYYY-NNNN
  4. Les dates sont au format YYYY-MM-DD
  5. La présentation entreprise : 2-3 phrases maximum
  6. Le programme : 3 à 8 modules selon la durée
  7. Chaque module a : numero, titre, duree, objectifs, contenu, methode
  8. Les garanties doivent être RÉALISTES (pas de "100%")
  9. Le ton est factuel, pas marketing
  10. La langue est FRANÇAIS professionnel
  11. AUCUNE mention de prix (c'est la partie financière)
  12. Si le TDR manque d'info, utilise "N/A" ou généralise
  13. Le JSON doit être STRICTEMENT conforme au format ci-dessus