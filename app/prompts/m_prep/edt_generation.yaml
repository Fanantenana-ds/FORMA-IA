            "heure_fin": "10:00",
            "module": "Introduction à l'IA",
            "type": "cours",
            "duree_minutes": 90,
            "formateur": "Nom",
            "salle": "Salle A",
            "objectifs": ["...", "..."]
          },
          {
            "id": "s_01_02",
            "heure_debut": "10:15",
            "heure_fin": "12:00",
            "module": "Apprentissage automatique",
            "type": "atelier",
            "duree_minutes": 105,
            "formateur": "Nom",
            "salle": "Salle A",
            "objectifs": ["...", "..."]
          }
        ],
        "pauses": [
          {"heure_debut": "10:00", "heure_fin": "10:15", "type": "pause"},
          {"heure_debut": "12:00", "heure_fin": "13:30", "type": "dejeuner"},
          {"heure_debut": "15:00", "heure_fin": "15:15", "type": "pause"}
        ]
      }
