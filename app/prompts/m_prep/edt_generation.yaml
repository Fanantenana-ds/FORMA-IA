contexte: |
  Contexte ALTIORA Prest (Antananarivo, Madagascar).

  Contraintes horaires standard :
    - Matin : 08:30 - 12:00
    - Pause matin : 10:00 - 10:15
    - Déjeuner : 12:00 - 13:30
    - Après-midi : 13:30 - 17:00
    - Pause après-midi : 15:00 - 15:15

  Durée typique d'une session : 1h30 à 2h.
  Maximum 4 sessions par jour.
  Alternance théorie / pratique recommandée.

  Langue : FRANÇAIS professionnel.
  Les dates sont au format YYYY-MM-DD.

regles: |
  1. Toujours retourner un JSON valide (pas de markdown)
  2. Les horaires suivent le format "HH:MM" (ex: "08:30")
  3. Chaque journée a un numéro et une date
  4. Chaque session a un ID unique : s_XX_YY (jour_session)
  5. Les durées sont en minutes (entier)
  6. Maximum 4 sessions par jour
  7. Respecter la pause déjeuner (12:00 - 13:30)
  8. Les pauses doivent être listées séparément
  9. Le résumé hebdomadaire doit totaliser les heures
  10. Alterner cours / atelier / projet pour l'engagement
  11. Ne pas dépasser 17:00 pour la fin des sessions
  12. Si un module est plus long, le répartir sur 2 sessions
  13. La langue est FRANÇAIS professionnel
  14. Les IDs de session ne doivent pas se répéter

